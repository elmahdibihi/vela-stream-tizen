<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=1920, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Vela Stream</title>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body>
  <!-- Splash -->
  <div id="splash" class="splash">
    <div class="splash-logo">VELA STREAM</div>
    <div class="splash-tag">Your shows · Live · On demand</div>
    <div class="splash-dots"><span></span><span></span><span></span></div>
  </div>

  <!-- AVPlay: always in DOM, z-index controlled by player -->
  <object id="avplay" type="application/avplayer"
          style="position:fixed;top:0;left:0;width:1920px;height:1080px;z-index:-1;display:none;"></object>

  <div id="app"></div>
  <div id="toast" class="toast hidden"></div>

  <script>
    // Non-destructive error handler — log and toast, don't wipe the app
    window.onerror = function(msg, src, line){
      try{
        console.error('[GLOBAL]', msg, src, line);
        if(window.App && typeof App.toast==='function') App.toast('Error: '+(msg||'').toString().slice(0,80), 4000);
      }catch(_){}
      return false;
    };
    window.addEventListener('unhandledrejection', e=>{
      console.error('[UNHANDLED]', e.reason);
    });
  </script>

  <script src="$WEBAPIS/webapis/webapis.js" onerror="console.warn('WebAPIs N/A')"></script>
  <script src="js/keys.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/api.js"></script>
  <script src="js/epg.js"></script>
  <script src="js/subtitles.js"></script>
  <script src="js/player.js"></script>
  <script src="js/spatial_navigation.js"></script>
  <script src="js/focus.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
